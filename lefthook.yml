# Install with `scripts/install-tools.sh && .tools/bin/lefthook install`.
pre-commit:
  parallel: true
  jobs:
    - name: forge fmt
      glob: "*.sol"
      exclude:
        - "lib/**"
        - "src/upgradeable/vendored/**"
        - "versions/v2/**"
      run: forge fmt {staged_files}
      stage_fixed: true
    - name: forge fmt v2
      root: versions/v2/
      glob: "*.sol"
      exclude: "versions/v2/lib/**"
      run: forge fmt {staged_files}
      stage_fixed: true
    - name: biome
      glob: "*.{js,jsx,ts,tsx,json,jsonc,md,yml,yaml}"
      exclude:
        - "lib/**"
        - "stdjson/**"
      run: .tools/bin/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: taplo
      glob: "*.toml"
      exclude:
        - "lib/**"
      run: .tools/bin/taplo fmt {staged_files}
      stage_fixed: true
    - name: shfmt
      glob: "*.sh"
      exclude:
        - "lib/**"
      run: .tools/bin/shfmt -w {staged_files}
      stage_fixed: true
