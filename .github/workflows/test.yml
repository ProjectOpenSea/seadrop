name: Test CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

env:
  FOUNDRY_VERSION: v1.9.0

jobs:
  lint:
    name: Run Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Check Solidity formatting
        run: forge fmt --check

      - name: Lint Solidity
        run: forge lint --deny warnings

      - name: Check formatting and lint with Biome
        run: npx biome ci .

  forge-test:
    name: Run Forge Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Run tests
        run: forge test -vvv
        env:
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
          GOERLI_RPC_URL: ${{ secrets.GOERLI_RPC_URL }}

  forge-test-upgradeable:
    name: Run Upgradeable Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Build and test with the deployable upgradeable settings
        run: forge test -vvv
        env:
          FOUNDRY_PROFILE: upgradeable

  forge-coverage:
    name: Run Forge Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Run coverage
        run: >-
          forge coverage --report summary --report lcov
          --no-match-coverage 'Shim|MaliciousRecipient|Deploy|Test|Snapshot'
        env:
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
          GOERLI_RPC_URL: ${{ secrets.GOERLI_RPC_URL }}

      - name: Submit coverage to Coveralls
        if: github.repository == 'ProjectOpenSea/seadrop'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./lcov.info
          flag-name: foundry
