name: Test CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    types: [opened, reopened, synchronize]

# A new push to a pull request cancels its older run. Every other run gets
# its own group, so no run on a branch or tag is cancelled or replaced
# while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FOUNDRY_VERSION: v1.9.0

jobs:
  lint:
    name: Run Linters
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-foundry
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      # The tools are pinned by version and SHA-256 in the install script, so
      # the cache only skips downloads.
      - name: Restore tools
        uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-tools.sh') }}

      - name: Install tools
        run: |
          scripts/install-tools.sh
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"

      - name: Check Solidity formatting
        run: forge fmt --check

      - name: Lint Solidity
        run: forge lint --deny warnings

      - name: Check formatting and lint with Biome
        run: biome ci .

      - name: Check TOML formatting
        run: taplo fmt --check

      - name: Lint shell scripts
        run: |
          shellcheck scripts/*.sh
          shfmt -d scripts/*.sh

      - name: Lint workflows
        run: actionlint

  forge-test:
    name: Run Forge Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-foundry
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Check contract sizes
        run: ./scripts/check_sizes.sh

      - name: Run tests
        run: forge test -vvv
        env:
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}

  forge-coverage:
    name: Run Forge Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-foundry
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Run coverage
        run: >-
          forge coverage --report summary --report lcov
          --no-match-coverage 'Shim|MaliciousRecipient|Deploy|Test|Snapshot'
        env:
          FOUNDRY_PROFILE: coverage
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}

      - name: Submit coverage to Coveralls
        if: github.repository == 'ProjectOpenSea/seadrop'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./lcov.info
          flag-name: foundry
