name: Test CI

on:
  push:
    branches: [main, v2]
    tags: ["*"]
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FOUNDRY_VERSION: v1.9.0

jobs:
  lint:
    name: Run Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Check Solidity formatting
        run: forge fmt --check

      - name: Patch Seaport pragmas
        run: ./scripts/patch_seaport_pragmas.sh

      - name: Lint Solidity
        run: forge lint --deny warnings

      - name: Check formatting and lint with Biome
        run: npx biome ci .

  forge-test:
    name: Run Forge Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Build Seaport artifacts
        run: ./scripts/build_seaport.sh

      - name: Build contracts
        run: forge build && ./scripts/show_headroom.sh

      - name: Run tests
        run: forge test -vvv
        env:
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
          GOERLI_RPC_URL: ${{ secrets.GOERLI_RPC_URL }}

  forge-coverage:
    name: Run Forge Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      # The tests deploy Seaport from these artifacts, so the coverage build
      # never compiles Seaport's OrderCombiner, which is stack too deep
      # without the optimizer. The 1155 implementation needs viaIR too,
      # hence --ir-minimum.
      - name: Build Seaport artifacts
        run: ./scripts/build_seaport.sh

      - name: Run coverage
        run: >-
          forge coverage --ir-minimum --report summary --report lcov
          --no-match-coverage 'test/|script/'
        env:
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
          GOERLI_RPC_URL: ${{ secrets.GOERLI_RPC_URL }}

      - name: Submit coverage to Coveralls
        if: github.repository == 'ProjectOpenSea/seadrop'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./lcov.info
          flag-name: foundry
