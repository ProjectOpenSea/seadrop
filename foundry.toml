[profile.default]
src = 'src'
test = 'test/foundry'
out = 'out'
libs = ['lib']
solc_version = '0.8.17'
remappings = [
    'openzeppelin-contracts/=lib/openzeppelin-contracts/contracts',
    'ds-test/=lib/forge-std/lib/ds-test/src/',
    'seadrop/=src/',
]
optimizer_runs = 1_000_000
# via_ir = true
ignored_error_codes = []
bytecode_hash = "none"
# The upgradeable scripts build only under the upgradeable profile below.
skip = ['script/upgradeable/**']

# The upgradeable contracts compile with the settings they were deployed
# with (formerly src-upgradeable/hardhat.config.ts): solc 0.8.17, via-IR,
# 1000 optimizer runs, and the default ipfs metadata hash.
# Run with FOUNDRY_PROFILE=upgradeable.
[profile.upgradeable]
src = 'src-upgradeable/src/'
test = 'test/upgradeable'
script = 'script/upgradeable'
skip = []
optimizer = true
optimizer_runs = 1_000
via_ir = true
bytecode_hash = 'ipfs'
# The scripts embed the implementation's creation code, so solc flags them as
# over the EIP-170 size limit. Scripts are never deployed; the implementation
# itself is checked as usual.
ignored_warnings_from = ['script/upgradeable']
fs_permissions = [
    { access = 'read-write', path = './src-upgradeable/deployment-addresses.json' },
    { access = 'read-write', path = './cache/upgradeable-deployment-addresses.test.json' },
]

[profile.ir_inspect]
test = 'src'

[rpc_endpoints]
goerli = '${GOERLI_RPC_URL}'
mainnet = '${ETHEREUM_RPC_URL}'
sepolia = '${SEPOLIA_RPC_URL}'

# See more config options https://github.com/foundry-rs/foundry/tree/master/config