[profile.default]
src = 'src'
test = 'test/foundry'
out = 'out'
libs = ['lib']
solc_version = '0.8.17'
remappings = [
    'openzeppelin-contracts/=lib/openzeppelin-contracts/contracts',
    'ds-test/=lib/forge-std/lib/ds-test/src/',
    'seadrop/=src/',
]
optimizer_runs = 1_000_000
# via_ir = true
ignored_error_codes = []
bytecode_hash = "none"
# The upgradeable contracts in src/upgradeable compile with the settings their
# implementations are deployed with (formerly src-upgradeable's Hardhat
# config): via-IR, 1000 optimizer runs, and the default ipfs metadata hash,
# which --verify needs to match. Files that import them (their tests and
# scripts) compile with those settings too, and everything else keeps the
# settings above. Keep regular contracts out of those files' imports, or they
# compile under both profiles and forge verify-contract asks which one.
additional_compiler_profiles = [
    { name = "upgradeable", via_ir = true, optimizer_runs = 1_000, bytecode_hash = "Ipfs" },
]
compilation_restrictions = [
    { paths = "src/upgradeable/**", via_ir = true, optimizer_runs = 1_000, bytecode_hash = "Ipfs" },
]
# The upgradeable scripts embed the implementation's creation code, so solc
# flags them as over the EIP-170 size limit. Scripts are never deployed; the
# implementation itself is checked as usual.
ignored_warnings_from = ['script/upgradeable']

# forge coverage turns the optimizer and via-IR off, but src/upgradeable keeps
# its restricted settings, so its coverage lands on the wrong lines. Coverage
# runs under this profile instead, which drops the restriction:
# FOUNDRY_PROFILE=coverage forge coverage (npm run coverage sets it).
[profile.coverage]
additional_compiler_profiles = []
compilation_restrictions = []

[profile.ir_inspect]
test = 'src'

[rpc_endpoints]
goerli = '${GOERLI_RPC_URL}'
mainnet = '${ETHEREUM_RPC_URL}'
sepolia = '${SEPOLIA_RPC_URL}'

[fmt]
line_length = 80
tab_width = 4
bracket_spacing = true
int_types = "preserve"
number_underscore = "preserve"
quote_style = "double"
prefer_compact = "none"
ignore = ["src/upgradeable/vendored/**"]

[lint]
lint_on_build = false
# These detectors only flag deliberate, audited patterns in the shipped
# contracts (payouts to configured recipients, external calls in admin loops,
# events after SeaDrop calls, the documented prevrandao offset, vendored
# ERC721A casts). CI runs `forge lint --deny warnings`, so every other rule
# still fails the build.
exclude_lints = [
    "arbitrary-send-eth",
    "block-timestamp",
    "calls-loop",
    "encode-packed-collision",
    "missing-events-arithmetic",
    "missing-zero-check",
    "reentrancy-events",
    "reentrancy-no-eth",
    "require-revert-in-loop",
    "unsafe-typecast",
    "weak-prng",
]

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
